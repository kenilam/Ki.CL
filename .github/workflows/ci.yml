name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # setup-node's yarn cache calls yarn, which has to be the packageManager
      # version by then. The runner ships Yarn 1.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      # No --fix here: CI reports, it does not rewrite.
      - run: yarn oxlint

      # Type checking is left out. `api/*` types come from App/@mf-types, which
      # is generated from a running Backend and is not committed.
      - run: yarn build:client
