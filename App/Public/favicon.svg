<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Ki.CL">
  <!--
    The logo's first two glyphs, lifted from App/Icons/Logo. The `k` and `i`
    groups already span exactly 0–160 on both axes there, so this viewBox
    crops them edge to edge with no margin and no refitting.

    Kept as geometry rather than an export so it stays in step with the logo:
    if a glyph changes shape, this is the same set of points to edit.

    The fill follows the browser's colour scheme rather than being baked in,
    so the mark stays legible against either tab bar. Chrome and Firefox
    honour a media query inside an SVG favicon; Safari currently ignores it
    and takes the light value, which is why light is the default rather than
    something only correct in one theme.
  -->
  <style>
    .kicl-glyph {
      fill: #141414;
    }

    @media (prefers-color-scheme: dark) {
      .kicl-glyph {
        fill: #f4f5f2;
      }
    }
  </style>
  <g class="kicl-glyph">
    <rect x="60" width="40" height="60" />
    <polygon
      points="0 0 0 160 40 160 40 100 60 100 60 160 100 160 100 80 70 80 70 60 40 60 40 0 0 0"
    />
    <rect x="120" width="40" height="40" />
    <rect x="120" y="60" width="40" height="100" />
  </g>
</svg>
