<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The wordmark's first two glyphs, as geometry rather than a raster, so the
      fill can follow the browser's colour scheme. Stays in the repository
      because it is markup, not binary, and because the browser asks for it
      before anything else has loaded.

      The previous href pointed at `Assets/favicon.png`, which has never
      existed in this repository - the site has been running without an icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="{{document_author}}" />
    <meta
      name="description"
      content="{{document_description}}"
    />
    <meta
      name="keywords"
      content="{{document_keywords}}"
    />
    <meta
      property="og:description"
      content="{{document_description}}"
    />
    <!-- <meta property="og:image" content="http://ki-cl.com/asset/image/site.hero.png"> -->
    <meta property="og:title" content="{{document_title}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ki-cl.com" />
    <!-- The words in braces are filled in by the server, from the `server` namespace. -->
    <title>{{document_title}}</title>
    <script src="https://use.typekit.net/cpi1lno.js"></script>
    <script>
      try {
        Typekit.load({ async: true });
      } catch (e) {}
    </script>
    <script>
      /*
       * The federation plugin adds this export to every module that imports
       * a remote. It isn't a component, so without this React Fast Refresh
       * rejects those modules and Vite reloads the whole page on each edit.
       */
      window.__getReactRefreshIgnoredExports = () => [
        '__mf_remote_dependency_pending',
      ];
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>{{document_noscript}}</noscript>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
