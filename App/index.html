<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The wordmark's first two glyphs, as geometry rather than a raster, so the
      fill can follow the browser's colour scheme. Stays in the repository
      because it is markup, not binary, and because the browser asks for it
      before anything else has loaded.

      The previous href pointed at `Assets/favicon.png`, which has never
      existed in this repository - the site has been running without an icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="Keni, Lam" />
    <meta
      name="description"
      content="An independent design agency specialising in creative consulting, branding and web development"
    />
    <meta
      name="keywords"
      content="Keni,Lam,kicl,KiCL,Ki.CL,Design,Developer,Creative"
    />
    <meta
      property="og:description"
      content="An independent design agency specialising in creative consulting, branding and web development"
    />
    <!-- <meta property="og:image" content="http://ki-cl.com/asset/image/site.hero.png"> -->
    <meta property="og:title" content="Ki.CL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ki-cl.com" />
    <title>Ki.CL</title>
    <script src="https://use.typekit.net/cpi1lno.js"></script>
    <script>
      try {
        Typekit.load({ async: true });
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Ki.CL needs JavaScript to run.</noscript>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
