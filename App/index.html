<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!--
      The wordmark's first two glyphs, as geometry rather than a raster, so the
      fill can follow the browser's colour scheme. Stays in the repository
      because it is markup, not binary, and because the browser asks for it
      before anything else has loaded.

      The previous href pointed at `Assets/favicon.png`, which has never
      existed in this repository - the site has been running without an icon.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="{{document_author}}" />
    <meta name="description" content="{{page.description}}" />
    <meta name="keywords" content="{{document_keywords}}" />
    <meta property="og:site_name" content="{{document_title}}" />
    <meta property="og:type" content="{{page.type}}" />
    <meta property="og:url" content="{{page.url}}" />
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:description" content="{{page.description}}" />
    <meta property="og:image" content="{{page.image}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{page.title}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The server fills in the words in braces: plain names from the `server` namespace, `page.` names from `App/middleware/crawl/previews.ts`. -->
    <title>{{document_title}}</title>
    <script>
      /*
       * The federation plugin adds this export to every module that imports
       * a remote. It isn't a component, so without this React Fast Refresh
       * rejects those modules and Vite reloads the whole page on each edit.
       */
      window.__getReactRefreshIgnoredExports = () => [
        '__mf_remote_dependency_pending',
      ];
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>{{document_noscript}}</noscript>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
