<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Knock knock</title>
<script src="https://use.typekit.net/cpi1lno.js"></script>
<script>try { Typekit.load({ async: true }); } catch (e) {}</script>
<style>
  :root {
    --bg: #f4f5f2;
    --ink: #141414;
    --soft: #5c5c5c;
    --accent: #d97904;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --ink: #f4f5f2;
      --soft: #a3a3a3;
    }
  }

  * { margin: 0; box-sizing: border-box; }

  body {
    min-block-size: 100dvh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.25rem;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--ink);
    font-family: 'mic-32-new-rounded-web', ui-rounded, system-ui, sans-serif;
    text-align: center;
  }

  header { display: grid; gap: 0.25rem; }

  p { font-size: clamp(1.125rem, 4.5vw, 1.5rem); }

  h1 {
    font-size: clamp(5.5rem, 30vw, 10rem);
    line-height: 0.85;
    letter-spacing: -0.04em;
  }

  strong { font-family: 'mic-32-new-web', system-ui, sans-serif; }

  img {
    inline-size: min(100vw - 2rem, 28rem);
    block-size: auto;
  }

  footer { display: grid; gap: 1.25rem; justify-items: center; }

  footer p { font-size: 1rem; color: var(--soft); }

  button {
    font: inherit;
    font-size: 1.125rem;
    padding: 0.75rem 1.75rem;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
    transition: transform 150ms ease;
  }

  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <p>Knock knock.</p>
    <h1>401</h1>
    <p>Who's there? <strong>Nice try.</strong></p>
  </header>

  <img src="guard.webp" width="760" height="600" alt="A nervous orange security guard holding a key card sits beside a locked door with a barrier across it.">

  <footer>
    <p>This page is for authorised guests only.<br>Please bring credentials next time.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </footer>
</body>
</html>
